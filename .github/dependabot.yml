# Weekly dependency updates, grouped to keep the PR count low. Packages that must move together are grouped so one PR
# upgrades them in lockstep (see docs/DEVELOPMENT.md, "Lint and format").
version: 2
updates:
  # pnpm (ADR 0049): Dependabot's npm ecosystem reads pnpm-lock.yaml and pnpm-workspace.yaml's catalog.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Pinned exactly: the browser sessions read Playwright internals (`_snapshotForAI` and its snapshot's format,
      # docs/ARCHITECTURE.md "Tools", Masking). A bump is by hand, after checking the snapshot against the golden
      # fixtures.
      - dependency-name: "@cloudflare/playwright"
      # Held while the workerd tests fail on Vitest 5.1 (docs/DEVELOPMENT.md, "Dependency notes"): vite-plus 1.5 and later
      # bundle it. Drop both entries when they pass, and move the catalog's `vite` alias with vite-plus by hand.
      - dependency-name: "vite-plus"
        versions: [">=1.5.0"]
      - dependency-name: "vitest"
        versions: [">=5.1.0"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Vite+ bundles Oxlint, Oxfmt, Vite and Vitest (ADR 0049); the catalog's `vitest` and `vite` (an alias of Vite+'s
      # core, which Dependabot does not move: edit it by hand) name the versions this vite-plus bundles, and the
      # workerd tests hold Vitest at 5.0.x until they pass on 5.1 with @cloudflare/vitest-plugin (docs/DEVELOPMENT.md,
      # "Dependency notes"). effect-tsgo patches tsrs, and each release patches only the tsrs versions it lists (ADR
      # 0047). tsrs (the typechecker) is pinned exactly in pnpm-workspace.yaml's catalog: its version names the
      # TypeScript release it ports. tsrslint is oxlint's type-aware backend until tsrs ships one (oxc-project/tsrs#378).
      toolchain:
        patterns:
          [
            "vite-plus",
            "@voidzero-dev/*",
            "vitest",
            "@vitest/*",
            "@cloudflare/vitest-plugin",
            "@effect/tsgo",
            "tsrs",
            "@maschwenk/tsrslint",
          ]
      effect:
        patterns: ["effect", "@effect/*"]
      # The sandbox toolkit's shell (#222): `@cloudflare/computer` is a preview whose API may change, pinned exactly in
      # packages/tools, with the just-bash its worker-shell backend runs pinned by the override in
      # pnpm-workspace.yaml. Upgrade them together, in a PR of their own, and only once
      # packages/tools/test/sandbox-toolkit.test.ts passes (the override moves by hand). The computer's computerd image
      # (infra/computer/Dockerfile, the `docker` entry below) moves with `@cloudflare/computer`: tools/check-computerd.sh,
      # run by `pnpm run lint`, fails until both name the same version.
      sandbox:
        patterns: ["@cloudflare/computer", "just-bash"]
      cloudflare:
        patterns: ["alchemy", "@distilled.cloud/*", "@cloudflare/*", "wrangler"]
      git-hooks:
        patterns: ["@commitlint/*"]
      minor-and-patch:
        update-types: [minor, patch]
  # The sandbox's computer image (#223): its two base images, pinned by digest.
  - package-ecosystem: docker
    directory: /infra/computer
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
