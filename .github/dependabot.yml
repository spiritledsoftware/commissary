# Weekly dependency updates, grouped to keep the PR count low. Packages that must move together are grouped so one PR
# upgrades them in lockstep (see docs/DEVELOPMENT.md, "Lint and format").
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # Pinned exactly: the browser sessions read Playwright internals (`_snapshotForAI` and its snapshot's format,
      # docs/ARCHITECTURE.md "Tools", Masking). A bump is by hand, after checking the snapshot against the golden
      # fixtures.
      - dependency-name: "@cloudflare/playwright"
    commit-message:
      prefix: chore
      include: scope
    groups:
      # effect-tsgo patches oxlint/tsgolint and targets one TypeScript release. tsrs (the typechecker) is pinned exactly
      # in the root package.json's catalog: its version names the TypeScript release it ports.
      lint-toolchain:
        patterns: ["oxlint", "oxlint-tsgolint", "@oxlint/*", "oxfmt", "@effect/tsgo", "tsrs"]
      effect:
        patterns: ["effect", "@effect/*"]
      # The sandbox toolkit's shell (#222): `@cloudflare/computer` is a preview whose API may change, pinned exactly in
      # packages/tools, with the just-bash its worker-shell backend runs pinned by the override in the root
      # package.json. Upgrade them together, in a PR of their own, and only once
      # packages/tools/test/sandbox-toolkit.test.ts passes (the override moves by hand). The computer's computerd image
      # (infra/computer/Dockerfile, the `docker` entry below) moves with `@cloudflare/computer`: tools/check-computerd.sh,
      # run by `bun run lint`, fails until both name the same version.
      sandbox:
        patterns: ["@cloudflare/computer", "just-bash"]
      cloudflare:
        patterns:
          ["alchemy", "@distilled.cloud/*", "@cloudflare/*", "wrangler", "vitest", "@vitest/*"]
      git-hooks:
        patterns: ["husky", "lint-staged", "@commitlint/*"]
      minor-and-patch:
        update-types: [minor, patch]
  # The sandbox's computer image (#223): its two base images, pinned by digest.
  - package-ecosystem: docker
    directory: /infra/computer
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
