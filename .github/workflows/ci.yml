# Checks every pull request and push to main, then deploys:
# - pull requests from this repository: a preview stage `pr-<number>` on its workers.dev URL (destroyed on close); with
#   the label `cloud-preview` the preview is Commissary Cloud (COMMISSARY_MODE=cloud, ADR 0026), without it a
#   self-hosted Commissary; with the label `preview-computer` it has the sandbox's computer (COMMISSARY_COMPUTER=on,
#   #223), without it none;
# - main: the `prod` stage (COMMISSARY_MODE from the production environment, self-hosted when unset) and, once the
#   `cloud` environment is set up (`.env.cloud`, `pnpm ci:setup`), the `cloud` stage: Commissary Cloud on its own domain.
# A change to documentation only (Markdown files anywhere, everything under docs/) skips the checks and deploys
# (tools/ci-changes.sh): the required checks still report, as skipped or with their steps skipped.
# Deploy setup (environments, secrets, variables): docs/DEPLOY.md.
name: ci

on:
  pull_request:
    # labeled/unlabeled: adding or removing `cloud-preview` redeploys the preview in the other mode, and
    # `preview-computer` with or without the computer.
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  # Deploy settings shared by every stage (infra/settings.ts); the environments hold the values.
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}

jobs:
  changes:
    name: changes
    if: >-
      github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
      github.event.label.name == 'cloud-preview' || github.event.label.name == 'preview-computer'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the changed files and the preview comment
    outputs:
      code: ${{ steps.changes.outputs.code }}
      previewed: ${{ steps.changes.outputs.previewed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci-changes.sh
          sparse-checkout-cone-mode: false
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: tools/ci-changes.sh

  # The jobs below run when `changes` says code changed, or when it could not tell (it failed: no output).
  static:
    name: typecheck, lint, workflows
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'cloud-preview' || github.event.label.name == 'preview-computer')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: static-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - name: actionlint
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  # Skipped step by step rather than as a job: a skipped matrix job reports one check under its unexpanded name,
  # and the required `test (n/3)` checks would never arrive.
  test:
    name: test (${{ matrix.shard }}/3)
    needs: changes
    if: >-
      !cancelled() &&
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'cloud-preview' || github.event.label.name == 'preview-computer')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: test-${{ matrix.shard }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Documentation only
        if: needs.changes.outputs.code == 'false'
        run: echo "::notice::documentation only; no tests to run"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: needs.changes.outputs.code != 'false'
      - run: pnpm test --shard="$SHARD/3"
        if: needs.changes.outputs.code != 'false'
        env:
          SHARD: ${{ matrix.shard }}

  smoke:
    name: smoke (alchemy dev)
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'cloud-preview' || github.event.label.name == 'preview-computer')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: smoke-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm smoke

  # The same under Commissary Cloud (ADR 0026, ADR 0030): the auth Worker beside the others, the sign-in on its port.
  smoke-cloud:
    name: smoke (alchemy dev, Commissary Cloud)
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.code != 'false' &&
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'cloud-preview' || github.event.label.name == 'preview-computer')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: smoke-cloud-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm smoke
        env:
          COMMISSARY_MODE: cloud

  deploy:
    name: deploy ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    needs: [changes, static, test, smoke, smoke-cloud]
    # Previews only for branches of this repository (fork and Dependabot runs get no deploy secrets).
    # Production only from main (a manual run on another branch must not deploy it).
    if: >-
      needs.changes.outputs.code != 'false' &&
      github.event.action != 'closed' &&
      (github.event.action != 'labeled' && github.event.action != 'unlabeled' ||
       github.event.label.name == 'cloud-preview' || github.event.label.name == 'preview-computer') &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]') ||
       (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # the preview URL comment
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    # One deploy per stage at a time; never cancel one midway.
    concurrency:
      group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The base domain (ADR 0031): the app host unless COMMISSARY_APP_DOMAIN names another, and the scope of
      # Commissary Cloud's session cookie. Previews ignore it.
      COMMISSARY_DOMAIN: ${{ vars.COMMISSARY_DOMAIN }}
      # The app host (ADR 0031), COMMISSARY_DOMAIN or a host under it; unset, COMMISSARY_DOMAIN. Previews ignore it.
      COMMISSARY_APP_DOMAIN: ${{ vars.COMMISSARY_APP_DOMAIN }}
      # The API host (ADR 0028), served by the API Worker; unset, zone routes send the client API paths on the app
      # host to it (ADR 0030). Previews ignore it.
      COMMISSARY_API_DOMAIN: ${{ vars.COMMISSARY_API_DOMAIN }}
      # Commissary Cloud's auth host (ADR 0030; default auth.<COMMISSARY_DOMAIN>). Previews ignore it.
      COMMISSARY_AUTH_DOMAIN: ${{ vars.COMMISSARY_AUTH_DOMAIN }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_ALLOW_EMAILS: ${{ vars.ACCESS_ALLOW_EMAILS }}
      ACCESS_ALLOW_EMAIL_DOMAINS: ${{ vars.ACCESS_ALLOW_EMAIL_DOMAINS }}
      PLATFORM_ADMIN_EMAILS: ${{ vars.PLATFORM_ADMIN_EMAILS }}
      ACCESS_ALLOW_SERVICE_TOKEN_IDS: ${{ vars.ACCESS_ALLOW_SERVICE_TOKEN_IDS }}
      ACCESS_SESSION_DURATION: ${{ vars.ACCESS_SESSION_DURATION }}
      # Managed OAuth for MCP clients on the app host's /mcp (ADR 0045, docs/ACCESS.md); off unless set to true.
      ACCESS_MANAGED_OAUTH: ${{ vars.ACCESS_MANAGED_OAUTH }}
      ACCESS_OAUTH_REDIRECT_URIS: ${{ vars.ACCESS_OAUTH_REDIRECT_URIS }}
      ACCESS_OAUTH_LOOPBACK_CLIENTS: ${{ vars.ACCESS_OAUTH_LOOPBACK_CLIENTS }}
      # Rotation of the secrets key (docs/DEPLOY.md); unset means generation 1 and no rotation.
      SECRETS_KEY_GENERATION: ${{ vars.SECRETS_KEY_GENERATION }}
      SECRETS_KEY_PREVIOUS_GENERATION: ${{ vars.SECRETS_KEY_PREVIOUS_GENERATION }}
      # Commissary Cloud (ADR 0026, docs/DEPLOY.md "Commissary Cloud"): previews with the `cloud-preview` label,
      # production when its environment sets COMMISSARY_MODE=cloud. The sign-in settings are read only then.
      COMMISSARY_MODE: >-
        ${{ github.event_name == 'pull_request' &&
        (contains(github.event.pull_request.labels.*.name, 'cloud-preview') && 'cloud' || 'self-hosted') ||
        vars.COMMISSARY_MODE }}
      # The sandbox's computer (#223, docs/DEPLOY.md "Optional pieces"): previews with the `preview-computer` label,
      # production when its environment sets COMMISSARY_COMPUTER=on (`pnpm ci:setup` writes it when `.env` does). Off
      # when unset. Its size: COMMISSARY_COMPUTER_INSTANCE, the default (standard-1) when unset.
      COMMISSARY_COMPUTER: >-
        ${{ github.event_name == 'pull_request' &&
        (contains(github.event.pull_request.labels.*.name, 'preview-computer') && 'on' || 'off') ||
        vars.COMMISSARY_COMPUTER }}
      COMMISSARY_COMPUTER_INSTANCE: ${{ vars.COMMISSARY_COMPUTER_INSTANCE }}
      SIGN_IN_GITHUB_CLIENT_ID: ${{ vars.SIGN_IN_GITHUB_CLIENT_ID }}
      SIGN_IN_GITHUB_CLIENT_SECRET: ${{ secrets.SIGN_IN_GITHUB_CLIENT_SECRET }}
      SIGN_IN_GOOGLE_CLIENT_ID: ${{ vars.SIGN_IN_GOOGLE_CLIENT_ID }}
      SIGN_IN_GOOGLE_CLIENT_SECRET: ${{ secrets.SIGN_IN_GOOGLE_CLIENT_SECRET }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      OWNED_ORG_LIMIT: ${{ vars.OWNED_ORG_LIMIT }}
      ORG_RATE_LIMIT_NAMESPACE_ID: ${{ vars.ORG_RATE_LIMIT_NAMESPACE_ID }}
      ORG_RATE_LIMIT_PAYG_NAMESPACE_ID: ${{ vars.ORG_RATE_LIMIT_PAYG_NAMESPACE_ID }}
      # Pay as you go through Polar (#237, docs/DEPLOY.md "Polar"): all three or none (none: no billing). Previews
      # use Polar's sandbox (the preview environment's values), the cloud stage production Polar.
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
      POLAR_PRODUCT_ID: ${{ vars.POLAR_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          # No dependency cache in jobs holding deploy credentials (cache poisoning).
          cache: "false"
      - name: Build the control panel
        run: pnpm build
      - name: Deploy
        id: deploy
        run: tools/deploy-stage.sh "$STAGE"
      - name: Check the deploy and Access
        if: env.COMMISSARY_MODE != 'cloud'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          API_URL: ${{ steps.deploy.outputs.api_url }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: tools/check-deploy.sh "$URL" "$API_URL"
      - name: Check the Commissary Cloud deploy
        if: env.COMMISSARY_MODE == 'cloud'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          API_URL: ${{ steps.deploy.outputs.api_url }}
          AUTH_URL: ${{ steps.deploy.outputs.auth_url }}
        run: tools/check-cloud-deploy.sh "$URL" "$API_URL" "$AUTH_URL"
      - name: Comment the preview URL
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          API_URL: ${{ steps.deploy.outputs.api_url }}
          AUTH_URL: ${{ steps.deploy.outputs.auth_url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$COMMISSARY_MODE" = cloud ]; then how="Commissary Cloud: sign in with GitHub or Google (auth host $AUTH_URL)"; else how="sign in with Access"; fi
          tools/preview-comment.sh "$PR" "Preview \`$STAGE\` deployed at $URL (commit ${SHA:0:8}), $how; the client API (API keys) is at $API_URL. Storage starts empty and is destroyed when the pull request closes."

  # Commissary Cloud (ADR 0026) deployed from main next to production: stage `cloud`, settings in the `cloud`
  # environment (docs/DEPLOY.md "The Commissary Cloud stage"). Skipped until that environment names its base domain
  # (COMMISSARY_DOMAIN).
  deploy-cloud:
    name: deploy cloud
    needs: [changes, static, test, smoke, smoke-cloud]
    if: >-
      needs.changes.outputs.code != 'false' &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: cloud
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-cloud
      cancel-in-progress: false
    env:
      STAGE: cloud
      CONFIGURED: ${{ vars.COMMISSARY_DOMAIN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # The base domain (ADR 0031): the app host unless COMMISSARY_APP_DOMAIN names another, and the scope of the
      # session cookie.
      COMMISSARY_DOMAIN: ${{ vars.COMMISSARY_DOMAIN }}
      # The app host (ADR 0031), COMMISSARY_DOMAIN or a host under it; unset, COMMISSARY_DOMAIN.
      COMMISSARY_APP_DOMAIN: ${{ vars.COMMISSARY_APP_DOMAIN }}
      # The API host (ADR 0028), served by the API Worker; unset, zone routes send the client API paths on the app
      # host to it (ADR 0030).
      COMMISSARY_API_DOMAIN: ${{ vars.COMMISSARY_API_DOMAIN }}
      # The auth host (ADR 0030; default auth.<COMMISSARY_DOMAIN>).
      COMMISSARY_AUTH_DOMAIN: ${{ vars.COMMISSARY_AUTH_DOMAIN }}
      PLATFORM_ADMIN_EMAILS: ${{ vars.PLATFORM_ADMIN_EMAILS }}
      SECRETS_KEY_GENERATION: ${{ vars.SECRETS_KEY_GENERATION }}
      SECRETS_KEY_PREVIOUS_GENERATION: ${{ vars.SECRETS_KEY_PREVIOUS_GENERATION }}
      # Always Commissary Cloud: infra/settings.ts refuses the stage otherwise.
      COMMISSARY_MODE: cloud
      # The sandbox's computer (#223): on when the environment sets it (`pnpm ci:setup` writes it when `.env.cloud`
      # does), at its size.
      COMMISSARY_COMPUTER: ${{ vars.COMMISSARY_COMPUTER }}
      COMMISSARY_COMPUTER_INSTANCE: ${{ vars.COMMISSARY_COMPUTER_INSTANCE }}
      SIGN_IN_GITHUB_CLIENT_ID: ${{ vars.SIGN_IN_GITHUB_CLIENT_ID }}
      SIGN_IN_GITHUB_CLIENT_SECRET: ${{ secrets.SIGN_IN_GITHUB_CLIENT_SECRET }}
      SIGN_IN_GOOGLE_CLIENT_ID: ${{ vars.SIGN_IN_GOOGLE_CLIENT_ID }}
      SIGN_IN_GOOGLE_CLIENT_SECRET: ${{ secrets.SIGN_IN_GOOGLE_CLIENT_SECRET }}
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      OWNED_ORG_LIMIT: ${{ vars.OWNED_ORG_LIMIT }}
      ORG_RATE_LIMIT_NAMESPACE_ID: ${{ vars.ORG_RATE_LIMIT_NAMESPACE_ID }}
      ORG_RATE_LIMIT_PAYG_NAMESPACE_ID: ${{ vars.ORG_RATE_LIMIT_PAYG_NAMESPACE_ID }}
      # Pay as you go through Polar (#237, docs/DEPLOY.md "Polar"): all three or none (none: no billing). Previews
      # use Polar's sandbox (the preview environment's values), the cloud stage production Polar.
      POLAR_ACCESS_TOKEN: ${{ secrets.POLAR_ACCESS_TOKEN }}
      POLAR_WEBHOOK_SECRET: ${{ secrets.POLAR_WEBHOOK_SECRET }}
      POLAR_PRODUCT_ID: ${{ vars.POLAR_PRODUCT_ID }}
    steps:
      - name: Not set up
        if: env.CONFIGURED != 'true'
        run: echo "::notice::the cloud environment sets no COMMISSARY_DOMAIN; skipping the Commissary Cloud deploy (docs/DEPLOY.md)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CONFIGURED == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        if: env.CONFIGURED == 'true'
        with:
          # No dependency cache in jobs holding deploy credentials (cache poisoning).
          cache: "false"
      - name: Build the control panel
        if: env.CONFIGURED == 'true'
        run: pnpm build
      - name: Deploy
        id: deploy
        if: env.CONFIGURED == 'true'
        run: tools/deploy-stage.sh "$STAGE"
      - name: Check the Commissary Cloud deploy
        if: env.CONFIGURED == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          API_URL: ${{ steps.deploy.outputs.api_url }}
          AUTH_URL: ${{ steps.deploy.outputs.auth_url }}
        run: tools/check-cloud-deploy.sh "$URL" "$API_URL" "$AUTH_URL"

  # Also after a docs-only pull request whose earlier commits deployed a preview.
  destroy-preview:
    name: destroy preview
    needs: changes
    if: >-
      !cancelled() &&
      (needs.changes.outputs.code != 'false' || needs.changes.outputs.previewed == 'true') &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # the preview comment
    environment:
      name: preview
    concurrency:
      group: deploy-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_ALLOW_EMAILS: ${{ vars.ACCESS_ALLOW_EMAILS }}
      ACCESS_ALLOW_SERVICE_TOKEN_IDS: ${{ vars.ACCESS_ALLOW_SERVICE_TOKEN_IDS }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          cache: "false"
      - name: Destroy
        run: |
          case "$STAGE" in pr-[0-9]*) ;; *) echo "::error::refusing to destroy stage $STAGE" >&2; exit 1 ;; esac
          pnpm run destroy --stage "$STAGE" --no-input --yes
      - name: Update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: tools/preview-comment.sh "$PR" "Preview \`$STAGE\` destroyed."
