# Puts each new GitHub issue's Linear copy into the Linear project Commissary (tools/linear-project.sh). Linear's GitHub
# Issues sync copies the issue into the team SPI but into no project, and agents read issues by project
# (docs/agents/issue-tracker.md). A dispatch takes an issue number, to retry one or to file one opened before this.
# Needs the repository secret LINEAR_API_KEY: a Linear API key that may edit SPI's issues.
name: linear project

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: GitHub issue number
        required: true
        type: number

permissions: {}

concurrency:
  group: linear-project-${{ github.event.issue.number || inputs.issue }}

jobs:
  project:
    name: project
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # the script
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/linear-project.sh
          sparse-checkout-cone-mode: false
      - name: Add to the project
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          # The Linear project Commissary (team SPI).
          LINEAR_PROJECT: 3893adf0-19a5-4074-977d-432548a64480
          ISSUE_URL: ${{ github.event.issue.html_url || format('{0}/{1}/issues/{2}', github.server_url, github.repository, inputs.issue) }}
        run: tools/linear-project.sh
