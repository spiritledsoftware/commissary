name: Release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Create Commissary App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.COMMISSARY_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMMISSARY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          owner: spiritledsoftware
          repositories: commissary

      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.16.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Version Packages pull request or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          commit: "chore: version packages"
          commitMode: github-api
          createGithubReleases: true
          publish: ${{ vars.NPM_PUBLISH_ENABLED == 'true' && 'pnpm run release' || '' }}
          title: "chore: version packages"
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
