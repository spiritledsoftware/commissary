name: setup
description: >-
  Vite+ (`vp`, the version pnpm-workspace.yaml's catalog names), Node.js (.node-version) and pnpm (package.json's
  `packageManager`), pnpm's packages from the Actions cache, and `vp install --frozen-lockfile` (ADR 0049).
inputs:
  cache:
    description: >-
      Restore and save pnpm's packages ("false" in jobs that hold deploy credentials: they neither read nor write the
      cache).
    default: "true"
runs:
  using: composite
  steps:
    # Keyed by pnpm-lock.yaml. pnpm checks each package it takes from the store against the lockfile's integrity hash.
    - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache }}
        run-install: |
          args: ["--frozen-lockfile"]
