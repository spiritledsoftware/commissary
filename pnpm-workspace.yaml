# The Workers and the control panel live in apps/, the libraries they share in packages/ (scope `@commissary/*`,
# source-only: they export TypeScript and are compiled by whatever imports them). docs/DEVELOPMENT.md, "Layout".
packages:
  - apps/*
  - packages/*

# Versions several packages share, named `catalog:` in their package.json so they cannot drift apart (two copies of
# `effect` in one bundle break its services).
catalog:
  "@effect/vitest": 4.0.4
  "@types/js-yaml": 4.0.9
  "@types/node": ^26.6.5
  effect: 4.0.4
  jose: ^6.2.12
  js-yaml: 4.3.2
  typescript: 7.0.2
  vitest: 5.0.3

allowBuilds:
  esbuild: true
  workerd: true
  # Native compressors just-bash may use in Node.js (optional); the sandbox's shell runs in a Dynamic Worker without them.
  "@mongodb-js/zstd": false
  node-liblzma: false

# samlify (through Better Auth's SSO plugin) pulls three copies of xpath; one keeps the Worker's bundle smaller.
overrides:
  xpath: 0.0.34
  # The sandbox toolkit's shell (@commissary/tools, #222): `@cloudflare/computer` is a preview, pinned exactly in
  # packages/tools, and so is the just-bash its worker-shell backend runs (the version its own tests run). An upgrade
  # of either needs a test run (packages/tools/test/sandbox-toolkit.test.ts) first: .github/dependabot.yml groups them.
  just-bash: 3.2.0
