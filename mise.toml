# The tools this repo pins, for mise. pnpm's version is the one in package.json's `packageManager` (which CI's
# setup-vp reads); keep the two equal. Node.js is .node-version's. Vite+ (`vp`) is a dependency of the repository:
# `pnpm exec vp`, or a global `vp`, which hands over to the project's own.
[tools]
pnpm = "12.18.0"
